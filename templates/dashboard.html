{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
    <h1 class="h3 mb-0" data-i18n="dash.title"></h1>
    <a href="/analytics" class="btn btn-outline-primary btn-sm" data-i18n="dash.view_analytics"></a>
</div>

<div id="kpi-row" class="row g-3 mb-4"></div>

<div class="card">
    <div class="card-header" data-i18n="dash.sync_status"></div>
    <div class="card-body" id="sync-panel">
        <span class="text-muted" data-i18n="msg.loading"></span>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
