{% extends "base.html" %}
{% block title %}Steam Library{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
    <div>
        <h1 class="h3 mb-0" data-i18n="library.title"></h1>
        <small id="total-count" class="text-muted"></small>
    </div>
    <div class="d-flex gap-2">
        <button id="sync-button" type="button" class="btn btn-outline-secondary"
                data-i18n="library.sync"></button>
        <button id="add-button" type="button" class="btn btn-primary"
                data-i18n="library.add"></button>
    </div>
</div>

<form id="search-form" class="card card-body mb-3">
    <div class="row g-2 align-items-end">
        <div class="col-12 col-md-4">
            <label class="form-label" for="filter-search" data-i18n="library.search"></label>
            <input id="filter-search" type="search" class="form-control"
                   data-i18n-placeholder="library.search">
        </div>
        <div class="col-6 col-md-2">
            <label class="form-label" for="filter-source" data-i18n="library.filter.source"></label>
            <select id="filter-source" class="form-select">
                <option value="" data-i18n="library.any"></option>
                <option value="steam" data-i18n="source.steam"></option>
                <option value="manual" data-i18n="source.manual"></option>
            </select>
        </div>
        <div class="col-6 col-md-2">
            <label class="form-label" for="filter-acquisition"
                   data-i18n="library.filter.acquisition"></label>
            <select id="filter-acquisition" class="form-select">
                <option value="" data-i18n="library.any"></option>
                <option value="paid" data-i18n="status.paid"></option>
                <option value="free_to_play" data-i18n="status.free_to_play"></option>
                <option value="free_claimed" data-i18n="status.free_claimed"></option>
                <option value="gift" data-i18n="status.gift"></option>
                <option value="unknown" data-i18n="status.unknown"></option>
            </select>
        </div>
        <div class="col-6 col-md-2">
            <label class="form-label" for="filter-completion"
                   data-i18n="library.filter.completion"></label>
            <select id="filter-completion" class="form-select">
                <option value="" data-i18n="library.any"></option>
                <option value="playing" data-i18n="completion.playing"></option>
                <option value="completed" data-i18n="completion.completed"></option>
                <option value="abandoned" data-i18n="completion.abandoned"></option>
                <option value="not_applicable" data-i18n="completion.not_applicable"></option>
                <option value="unknown" data-i18n="completion.unknown"></option>
            </select>
        </div>
        <div class="col-6 col-md-2 d-flex flex-column gap-1">
            <div class="form-check">
                <input id="filter-hidden" class="form-check-input" type="checkbox">
                <label class="form-check-label" for="filter-hidden"
                       data-i18n="library.filter.include_hidden"></label>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary btn-sm flex-fill"
                        data-i18n="library.search_btn"></button>
                <button type="button" id="reset-button" class="btn btn-outline-secondary btn-sm flex-fill"
                        data-i18n="library.reset"></button>
            </div>
        </div>
    </div>
</form>

<div id="loading" class="text-muted small d-none" data-i18n="msg.loading"></div>

<div class="table-responsive">
    <table class="table table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th data-i18n="col.name"></th>
            <th data-i18n="col.minutes"></th>
            <th data-i18n="col.acquisition"></th>
            <th data-i18n="col.completion"></th>
            <th data-i18n="col.progress"></th>
            <th data-i18n="col.purchases"></th>
            <th data-i18n="col.actions"></th>
        </tr>
        </thead>
        <tbody id="games-body"></tbody>
    </table>
</div>

<div class="d-flex justify-content-between align-items-center">
    <button id="prev-page" type="button" class="btn btn-outline-secondary btn-sm">‹</button>
    <span id="page-info" class="text-muted small"></span>
    <button id="next-page" type="button" class="btn btn-outline-secondary btn-sm">›</button>
</div>

<div class="modal fade" id="editor-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="editor-title" class="modal-title h5"></h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label" for="field-name" data-i18n="form.name"></label>
                    <input id="field-name" type="text" class="form-control" maxlength="255" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="field-developer" data-i18n="form.developer"></label>
                    <input id="field-developer" type="text" class="form-control" maxlength="255">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="field-acquisition"
                               data-i18n="form.acquisition"></label>
                        <select id="field-acquisition" class="form-select">
                            <option value="unknown" data-i18n="status.unknown"></option>
                            <option value="paid" data-i18n="status.paid"></option>
                            <option value="free_to_play" data-i18n="status.free_to_play"></option>
                            <option value="free_claimed" data-i18n="status.free_claimed"></option>
                            <option value="gift" data-i18n="status.gift"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="field-completion"
                               data-i18n="form.completion"></label>
                        <select id="field-completion" class="form-select">
                            <option value="unknown" data-i18n="completion.unknown"></option>
                            <option value="playing" data-i18n="completion.playing"></option>
                            <option value="completed" data-i18n="completion.completed"></option>
                            <option value="abandoned" data-i18n="completion.abandoned"></option>
                            <option value="not_applicable" data-i18n="completion.not_applicable"></option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="field-progress" data-i18n="form.progress"></label>
                    <input id="field-progress" type="number" min="0" max="100" class="form-control">
                </div>
                <div class="form-check mb-2">
                    <input id="field-records" class="form-check-input" type="checkbox">
                    <label class="form-check-label" for="field-records"
                           data-i18n="form.records_complete"></label>
                </div>
                <div class="form-check">
                    <input id="field-hidden" class="form-check-input" type="checkbox">
                    <label class="form-check-label" for="field-hidden" data-i18n="form.hidden"></label>
                </div>
                <div id="editor-error" class="alert alert-danger mt-3 mb-0 d-none"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"
                        data-i18n="btn.cancel"></button>
                <button id="editor-save" type="button" class="btn btn-primary"
                        data-i18n="btn.save"></button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/library.js') }}"></script>
{% endblock %}
