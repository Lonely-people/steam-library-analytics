<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} · Steam Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/" data-i18n="app.title"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/library" data-i18n="nav.library"></a></li>
                <li class="nav-item"><a class="nav-link disabled" href="#" data-i18n="nav.dashboard"></a></li>
                <li class="nav-item"><a class="nav-link disabled" href="#" data-i18n="nav.purchases"></a></li>
                <li class="nav-item"><a class="nav-link disabled" href="#" data-i18n="nav.analytics"></a></li>
            </ul>
            <button id="lang-toggle" class="btn btn-outline-light btn-sm" type="button">
                <span data-i18n="lang.switch"></span>
            </button>
        </div>
    </div>
</nav>

<main class="container py-4">
    {% block content %}{% endblock %}
</main>

<div id="toast-box" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080;"></div>

<script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
